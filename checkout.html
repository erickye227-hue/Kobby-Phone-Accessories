<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Checkout - Kobby's Phone Accessories & Repair
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>
Kobby's Phone Accessories & Repair
</h1>


<nav>

<a href="index.html">
🏠 Home
</a>


<a href="cart.html">
🛒 Cart
</a>


</nav>

</header>



<main>


<section class="checkout-section">


<h2>
Checkout
</h2>



<form id="checkout-form">



<!-- Customer Information -->

<div class="checkout-box">


<h3>
Customer Information
</h3>


<input 
type="text" 
id="customer-name"
placeholder="Full Name"
required
>


<input 
type="tel" 
id="customer-phone"
placeholder="Phone Number"
required
>



<textarea
id="customer-address"
placeholder="Delivery Address"
required></textarea>



</div>




<!-- Order Summary -->

<div class="checkout-box">


<h3>
Your Order
</h3>


<div id="order-summary">

</div>



<h3 id="checkout-total">
Total: ₵0
</h3>



</div>




<button type="submit" class="place-order-btn">

Place Order

</button>



</form>



</section>


</main>




<footer>

<p>
© 2026 Kobby's Phone Accessories & Repair
</p>

</footer>




<script src="js/checkout.js"></script>


</body>

</html>
